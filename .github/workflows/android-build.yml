#!/bin/sh

# Update workflow to build project from CubeLauncher folder
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Prepare project
      run: |
        # If project files already in CubeLauncher, use it; otherwise, move root files
        if [ -d CubeLauncher ] && [ -f CubeLauncher/gradlew ]; then
          echo "Project already in CubeLauncher"
        else
          mkdir -p CubeLauncher
          mv gradlew gradlew.bat settings.gradle build.gradle gradle.properties CubeLauncher/ || true
        fi

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Install Android commandline tools
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
        mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
        rm cmdline-tools.zip

    - name: Install SDK components
      run: |
        export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses
        sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Make gradlew executable and build debug APK
      run: |
        cd CubeLauncher
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/app/build/outputs/apk/debug/*.apk'
