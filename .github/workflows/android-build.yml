name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        if [ -f CubeLauncher.zip ]; then
          mkdir -p extracted
          unzip -q CubeLauncher.zip -d extracted
        else
          echo "CubeLauncher.zip not found in repo root" && exit 1
        fi

    - name: Find project dir and gradlew
      id: find
      run: |
        # Найдём первый gradlew в распакованной папке
        GRADLE_PATH=$(find extracted -type f -name gradlew | head -n 1 || true)
        if [ -z "$GRADLE_PATH" ]; then
          echo "gradlew not found" && exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLE_PATH")
        echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Install Android commandline tools
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
        mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
        rm cmdline-tools.zip

    - name: Install SDK components
      run: |
        export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses
        sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Make gradlew executable and build debug APK
      run: |
        cd "${{ steps.find.outputs.project_dir }}"
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/app/build/outputs/apk/debug/*.apk'
